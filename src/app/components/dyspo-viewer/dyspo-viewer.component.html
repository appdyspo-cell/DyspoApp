<div class="viewer-card">

  <!-- Croix fermeture — haut droite -->
  <button class="viewer-close" (click)="close()">
    <ion-icon name="close-outline"></ion-icon>
  </button>

  <!-- Image -->
  <img [src]="image" class="viewer-img"
       (error)="$any($event.target).style.display='none'" />

</div>

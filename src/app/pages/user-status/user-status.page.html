<ion-content [fullscreen]="true" class="bg_color">
  <div class="main">
    <!-- ── Bloc Notifications ──────────────────────────────────────── -->
    <div class="notif-center" (click)="openAllNotifications()">
      <div class="notif-icon-wrap">
        <ion-icon name="notifications-outline" class="notif-bell-icon"></ion-icon>
        <div class="notif-badge-dot" *ngIf="totalNotifications > 0">{{ totalNotifications }}</div>
      </div>
      <span class="notif-label">Notifications</span>
      <span class="notif-sub" *ngIf="totalNotifications === 0">Aucune notification</span>
    </div>
    <!-- ── Date ───────────────────────────────────────────────── -->
    <div class="status-date-block">
      <ion-text class="today-pre">- Aujourd'hui -</ion-text>
      <span class="today-date">{{todayFormatted}}</span>
    </div>

    <!-- ── Bulle statut (tap → modal) ─────────────────────────── -->
    <button id="open-status-modal" class="status-bubble-block animate__animated animate__fadeIn">
      <span class="status-tap-hint">Appuyer pour changer</span>
      <ion-img *ngIf="todayDyspo?.userDyspo === dyspoStatus.DYSPO"        src="/assets/newimg/home_dyspo.png"></ion-img>
      <ion-img *ngIf="todayDyspo?.userDyspo === dyspoStatus.DYSPOWITHKIDS" src="/assets/newimg/home_dyspo_wk.png"></ion-img>
      <ion-img *ngIf="todayDyspo?.userDyspo === dyspoStatus.NODYSPO"       src="/assets/newimg/home_pas_dyspo.png"></ion-img>
      <ion-img *ngIf="todayDyspo?.userDyspo === dyspoStatus.UNDEFINED"     src="/assets/newimg/home_pas_dyspo.png"></ion-img>
    </button>

    <!-- ── CTA ────────────────────────────────────────────────── -->
    <div class="cta-invite">
      <p class="cta-label">Planifiez votre prochain moment</p>
      <p class="cta-phrase" [class.cta-visible]="ctaVisible">{{ ctaPhrase }}</p>
    </div>

    <ion-row
      class="ion-justify-content-center"
      style="margin-bottom: 35px; margin-top: 10px"
    >
      <ion-col size="4">
        <div (click)="openCreateEventDyspo()">
          <ion-img src="../../../assets/newimg/creer_event_dyspo.png"></ion-img>
        </div>
      </ion-col>
      <ion-col size="4">
        <div (click)="openCreateEventDyspoWithKids()">
          <ion-img
            src="../../../assets/newimg/creer_event_dyspo_wk.png"
          ></ion-img>
        </div>
      </ion-col>
      <ion-col size="4">
        <div (click)="openCreateEventPerso()">
          <ion-img src="../../../assets/newimg/creer_event_perso.png"></ion-img>
        </div>
      </ion-col>
    </ion-row>

    <div
      style="
        display: flex;
        align-items: center;
        width: 100%;
        margin-bottom: 16px;
      "
    >
      <div style="border: 1px solid lightgray; width: 100%; height: 2px"></div>

      <div
        style="
          text-align: center;
          font-size: 1.05em;
          font-weight: 600;
          min-width: 205px;
          text-transform: uppercase;
        "
      >
        événements à venir
      </div>

      <div style="border: 1px solid lightgray; width: 100%; height: 2px"></div>
    </div>
  </div>

  <!-- <div
    class="d-flex ion-justify-content-between ion-align-items-center ion-padding"
    style="padding-bottom: 0px; padding-top: 0px"
  ></div> -->

  <ion-card-content style="padding-top: 0">
    <div *ngIf="nextAgendaEvents.length === 0">Aucun événement planifié</div>
    <div class="next-agenda-container">
      <app-agenda-event-mini
        *ngFor="let nextEvent of nextAgendaEvents"
        class="animate__animated animate__fadeIn"
        [agendaEvent]="nextEvent"
        [isInvitation]="false"
        (click)="openAgendaEventInfo(nextEvent)"
      >
      </app-agenda-event-mini>
    </div>
  </ion-card-content>

  <!-- ── Modal statut centré ──────────────────────────────────── -->
  <ion-modal
    #statusmodal
    trigger="open-status-modal"
    (willDismiss)="onWillDismiss($event)"
    cssClass="status-center-modal"
  >
    <ng-template>
      <div class="status-modal-content">
        <div class="status-modal-inner">

          <div class="status-modal-header">
            <div class="status-modal-title">Mon statut du jour</div>
            <div class="status-modal-sub">Sélectionne ta disponibilité</div>
          </div>

          <div class="status-options">

            <button class="status-option status-opt-dyspo"
                    (click)="updateStatus(dyspoStatus.DYSPO)">
              <ion-img src="/assets/newimg/home_dyspo.png" class="sopt-img"></ion-img>
              <div class="sopt-text">
                <span class="sopt-label">Je suis Dyspo !</span>
                <span class="sopt-sub">Disponible pour sortir</span>
              </div>
              <ion-icon name="chevron-forward-outline" class="sopt-arrow"></ion-icon>
            </button>

            <button *ngIf="userSvc.userInfo?.with_kids"
                    class="status-option status-opt-kids"
                    (click)="updateStatus(dyspoStatus.DYSPOWITHKIDS)">
              <ion-img src="/assets/newimg/home_dyspo_wk.png" class="sopt-img"></ion-img>
              <div class="sopt-text">
                <span class="sopt-label">Dyspo avec kids</span>
                <span class="sopt-sub">Disponible en famille</span>
              </div>
              <ion-icon name="chevron-forward-outline" class="sopt-arrow"></ion-icon>
            </button>

            <button class="status-option status-opt-nodyspo"
                    (click)="updateStatus(dyspoStatus.NODYSPO)">
              <ion-img src="/assets/newimg/home_pas_dyspo.png" class="sopt-img"></ion-img>
              <div class="sopt-text">
                <span class="sopt-label">Pas Dyspo</span>
                <span class="sopt-sub">Je ne suis pas dispo</span>
              </div>
              <ion-icon name="chevron-forward-outline" class="sopt-arrow"></ion-icon>
            </button>

          </div>

          <button class="status-cancel-btn" (click)="modal.dismiss()">Annuler</button>
        </div>
      </div>
    </ng-template>
  </ion-modal>
</ion-content>

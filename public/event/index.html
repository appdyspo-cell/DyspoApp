<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Dyspo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2d8aaa">
  <meta name="description" content="Ouvre cet événement dans l'application Dyspo">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f7fa;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px 36px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(45,138,170,.12), 0 2px 8px rgba(0,0,0,.06);
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #2d8aaa;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg { width: 40px; height: 40px; }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a2e38;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 0.95rem;
      color: #5a7a87;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #d6eef5;
      border-top-color: #2d8aaa;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity .15s, transform .15s;
    }
    .btn:active { opacity: .85; transform: scale(.98); }

    .btn-primary {
      background: #2d8aaa;
      color: #fff;
      margin-bottom: 12px;
    }

    .btn-store {
      background: #f0f7fa;
      color: #2d8aaa;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    #state-loading { display: block; }
    #state-open    { display: none; }
    #state-install { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <!-- Icône calendrier simple -->
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="9" width="30" height="26" rx="5" fill="white" fill-opacity=".2"/>
        <rect x="5" y="9" width="30" height="26" rx="5" stroke="white" stroke-width="2.5"/>
        <line x1="5" y1="17" x2="35" y2="17" stroke="white" stroke-width="2"/>
        <line x1="13" y1="5" x2="13" y2="13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="27" y1="5" x2="27" y2="13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="14" cy="24" r="2" fill="white"/>
        <circle cx="20" cy="24" r="2" fill="white"/>
        <circle cx="26" cy="24" r="2" fill="white"/>
        <circle cx="14" cy="30" r="2" fill="white"/>
        <circle cx="20" cy="30" r="2" fill="white"/>
      </svg>
    </div>

    <!-- État : ouverture en cours -->
    <div id="state-loading">
      <div class="spinner"></div>
      <h1>Ouverture de l'événement…</h1>
      <p>L'application Dyspo va s'ouvrir automatiquement.</p>
    </div>

    <!-- État : bouton manuel si l'app ne s'est pas ouverte -->
    <div id="state-open">
      <h1>Ouvrir dans Dyspo</h1>
      <p>Appuie sur le bouton ci-dessous pour voir cet événement dans l'application.</p>
      <a id="btn-open" href="#" class="btn btn-primary">Ouvrir l'événement →</a>
    </div>

    <!-- État : application non installée -->
    <div id="state-install">
      <h1>Installe Dyspo</h1>
      <p>Télécharge l'application gratuite pour voir cet événement.</p>
      <a href="https://play.google.com/store/apps/details?id=com.liaisongraphique.dyspo"
         class="btn btn-store" target="_blank">
        📱 Google Play
      </a>
      <a href="https://apps.apple.com/fr/app/dyspo/id6478592537"
         class="btn btn-store" target="_blank">
        🍎 App Store
      </a>
    </div>
  </div>

  <script>
    (function () {
      // Extraire l'UID depuis l'URL : /event/<uid>
      var uid = window.location.pathname.split('/event/').pop().replace(/\/$/, '');
      var deepLink = 'dyspo://event/' + uid;

      var stateLoading = document.getElementById('state-loading');
      var stateOpen    = document.getElementById('state-open');
      var stateInstall = document.getElementById('state-install');
      var btnOpen      = document.getElementById('btn-open');

      btnOpen.href = deepLink;

      // Tenter d'ouvrir l'app immédiatement
      function tryOpen() {
        window.location.href = deepLink;
      }

      // Après 2,5 s : si l'app ne s'est pas ouverte → montrer le bouton manuel
      // Après 5 s supplémentaires sans action : proposer le téléchargement
      tryOpen();

      var openTimer = setTimeout(function () {
        stateLoading.style.display = 'none';
        stateOpen.style.display    = 'block';
      }, 2500);

      var installTimer = setTimeout(function () {
        stateLoading.style.display  = 'none';
        stateOpen.style.display     = 'none';
        stateInstall.style.display  = 'block';
      }, 10000);

      // Si la page perd le focus, l'app s'est probablement ouverte → annuler les timers
      window.addEventListener('blur', function () {
        clearTimeout(openTimer);
        clearTimeout(installTimer);
      });
    })();
  </script>
</body>
</html>
